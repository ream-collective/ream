name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master", "develop" ]

env:
  CARGO_TERM_COLOR: always
  UDEPS_TOOLCHAIN: nightly-2026-10-09

jobs:
  cargo-udeps:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true        

    # Pinned: nightlies from 2026-10-11 hit a rustc ICE while compiling p3-monty-31.
    - name: Install pinned nightly toolchain
      run: rustup toolchain install ${{ env.UDEPS_TOOLCHAIN }} --profile minimal

    - name: Install cargo udeps
      run: cargo install cargo-udeps --locked

    - name: Run cargo udeps
      run: cargo +${{ env.UDEPS_TOOLCHAIN }} udeps --workspace --tests --all-targets --release --exclude ef-tests
  
  cargo-workspace-lints:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true        

    - name: Install cargo workspace lints
      run: cargo install cargo-workspace-lints --locked

    - name: Run cargo workspace lints
      run: cargo workspace-lints
